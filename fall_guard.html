<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小辣椒 · 安全守护</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#244e3e;font-family:system-ui,'Microsoft YaHei',sans-serif;font-size:22px}main{max-width:1100px;margin:auto;padding:25px}h1{font-size:38px}section{background:#fff;border-radius:22px;padding:28px;margin:18px 0;box-shadow:0 5px 25px #0001}button,a.btn{font-size:22px;padding:17px 25px;border:0;border-radius:16px;background:#286a50;color:white;cursor:pointer;margin:8px;text-decoration:none;display:inline-block}button.secondary{background:#607286}button.danger{background:#b64e39}button:disabled{opacity:.5}.muted{color:#65746c}.alert{background:#fff1e7;border:3px solid #d86c3b}#alert{display:none}#alert.visible{display:block}li{padding:9px;border-bottom:1px solid #eee}small{font-size:16px}#error{color:#ae382d} .notice{background:#fff9dd} @media(max-width:600px){main{padding:12px}section{padding:18px}button{width:100%;margin:6px 0}}</style></head><body><main>
<a class="btn secondary" href="/">← 返回首页</a><h1>🛡️ 小辣椒安全守护</h1>
<section class="notice"><strong>实验性跌倒识别</strong><p>仅用于研究与功能演示，不保证识别所有跌倒，也可能误报。不能替代紧急呼叫设备或人工照护。摄像头图像只在本机分析，不上传视频。</p></section>
<section><h2>摄像头监测</h2><p id="state">正在读取状态…</p><p class="muted" id="error"></p><button id="start">▶ 开启监测</button><button class="secondary" id="stop">■ 停止监测</button><p><small>需要安装 ultralytics、opencv-python，并准备 YOLOv8 Pose 模型；视频通话占用同一摄像头时请先停止监测。</small></p></section>
<section id="alert" class="alert" role="alert"><h2>⚠️ 检测到疑似跌倒</h2><p>爷爷奶奶，您还好吗？需要我联系家人吗？</p><button id="safe">我没事，取消提醒</button><button class="danger" id="help">我需要帮助</button><p class="muted">如果无法回应，请家属主动查看并联系老人；本版本暂未接入可靠的自动推送。</p></section>
<section><h2>最近事件</h2><ul id="events"><li>暂无记录</li></ul><p class="muted"><small>事件暂存在本次服务器进程内，重启后清空。</small></p></section>
</main><script>
const $=id=>document.getElementById(id);let lastAlert=null;let speaking=false;
async function req(path,method='GET',data){let r=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j;}
function say(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u);}catch(e){}}
async function refresh(){try{let d=await req('/api/fall/status');$('state').textContent=d.status;$('error').textContent=d.error||'';$('start').disabled=d.running;$('stop').disabled=!d.running;$('alert').classList.toggle('visible',!!d.pending);if(d.pending&&d.pending.id!==lastAlert){lastAlert=d.pending.id;say('爷爷奶奶，您是不是摔倒了？如果需要帮助，请点击我需要帮助。');}if(!d.pending)lastAlert=null;$('events').replaceChildren(...d.events.map(x=>{let li=document.createElement('li');li.textContent=new Date(x.time*1000).toLocaleString('zh-CN')+' · '+x.message;return li;}));if(!d.events.length)$('events').textContent='暂无记录';}catch(e){$('state').textContent='读取失败：'+e.message;}}
async function act(path,body){try{await req(path,'POST',body||{});await refresh();}catch(e){alert(e.message)}}
$('start').onclick=()=>act('/api/fall/start');$('stop').onclick=()=>act('/api/fall/stop');$('safe').onclick=()=>act('/api/fall/ack',{action:'safe'});$('help').onclick=()=>act('/api/fall/ack',{action:'help'});refresh();setInterval(refresh,2000);
</script></body></html>
